version: "3.9"

services:

  frontend:
    build: ./frontend
    ports:
      - "5173:4173"
    environment:
      - VITE_API_BASE_URL=http://backend:8080/api
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/mi_basedatos
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=admin123
    depends_on:
      - database

  database:
    image: postgres:15
    environment:
      POSTGRES_DB: mi_basedatos
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: